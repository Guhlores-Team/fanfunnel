name: E2E (real Supabase — login UI)

# Browser-level auth test against a REAL Supabase project: builds the app with
# the project's public env (NEXT_PUBLIC_* are inlined at build time), starts it,
# and drives the real /login page (sign in as a pre-created, approved creator)
# to confirm the session reaches a working dashboard.
#
# Separate from the headless e2e-supabase workflow because it needs a build +
# running app + Chromium. Self-skips (exit 0) when the secrets are absent. Use a
# DEDICATED test project (it creates and deletes users).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  login-ui:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # NEXT_PUBLIC_* are inlined here so the browser client points at the
      # test project. (Falls back to mock build if secrets are unset; the test
      # then skips.)
      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Login-UI E2E (skips if secrets unset)
        run: |
          npx next start -p 3000 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000 >/dev/null && break || sleep 2
          done
          E2E_BASE_URL=http://localhost:3000 npm run e2e:login
          STATUS=$?
          kill $SERVER_PID 2>/dev/null || true
          exit $STATUS
