name: E2E (real Supabase — login UI)

# Browser-level auth test against a REAL Supabase project: builds the app with
# the project's public env (NEXT_PUBLIC_* are inlined at build time), starts it,
# and drives the real /login page (sign in as a pre-created, approved creator)
# to confirm the session reaches a working dashboard.
#
# Separate from the headless e2e-supabase workflow because it needs a build +
# running app + Chromium. Self-skips (exit 0) when the secrets are absent. Use a
# DEDICATED test project (it creates and deletes users).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      preview_url:
        description: "Optional: immutable FanFunnel Preview URL for the separate hosted LCP measurement"
        required: false
        type: string
        default: ""
      expected_sha:
        description: "Full checked dashboard-redesign commit SHA for that immutable Preview"
        required: false
        type: string
        default: ""

      preview_smoke_url:
        description: "Optional immutable Preview URL for the separate real Focus/Scratch/Bingo browser smoke"
        required: false
        type: string
        default: ""
      preview_smoke_expected_sha:
        description: "Full checked dashboard-redesign SHA for that immutable feature-smoke Preview"
        required: false
        type: string
        default: ""

jobs:
  login-ui:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # NEXT_PUBLIC_* are inlined here so the browser client points at the
      # test project. (Falls back to mock build if secrets are unset; the test
      # then skips.)
      - name: Build
        run: npm run build

      # ubuntu-latest is 26.04: needs playwright >= 1.61 (first release supporting it).
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Login-UI E2E (skips if secrets unset)
        env:
          # Only the Next runtime and login fixture need the private key.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # This localhost auth server must not report shared deployment health.
          FANFUNNEL_CI_LOCAL_SERVER: "1"
        run: |
          npx next start -p 3000 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000 >/dev/null && break || sleep 2
          done
          E2E_BASE_URL=http://localhost:3000 npm run e2e:login
          STATUS=$?
          kill $SERVER_PID 2>/dev/null || true
          exit $STATUS

      - name: Upload login-UI artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: login-ui-artifacts
          path: e2e/artifacts/
          if-no-files-found: ignore

  preview-lcp:
    # Existing PR/push/login-ui behavior is unchanged. A requested measurement
    # fails closed if credentials or exact Preview/source checks are missing.
    if: github.event_name == 'workflow_dispatch' && inputs.preview_url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: fanfunnel-preview-lcp
      cancel-in-progress: false
    env:
      PREVIEW_PERF_URL: ${{ inputs.preview_url }}
      PREVIEW_EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Verify manual source, authenticated Preview metadata and TEST-only configuration
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node e2e/preview-lcp.mjs --preflight

      - name: Install existing dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Measure real immutable Preview before and after creator theming
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node e2e/preview-lcp.mjs

      - name: Upload numeric Preview LCP report and anonymous public screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: preview-lcp-${{ github.sha }}
          path: e2e/artifacts/preview-lcp/
          if-no-files-found: ignore
          retention-days: 7

  preview-feature-smoke:
    # Explicit manual opt-in only; existing login-ui and preview-lcp are unchanged.
    if: github.event_name == 'workflow_dispatch' && inputs.preview_smoke_url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: fanfunnel-preview-feature-smoke
      cancel-in-progress: false
    env:
      PREVIEW_FEATURE_URL: ${{ inputs.preview_smoke_url }}
      PREVIEW_EXPECTED_SHA: ${{ inputs.preview_smoke_expected_sha }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Verify exact source, immutable Preview metadata and TEST-only configuration
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node e2e/preview-feature-smoke.mjs --preflight

      - name: Install existing dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Click actual Preview login, terms, Focus, Scratch and bounded Bingo flows
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node e2e/preview-feature-smoke.mjs

      - name: Upload only sanitized feature-smoke provenance, counts and cleanup result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: preview-feature-smoke-${{ github.sha }}
          path: e2e/artifacts/preview-feature-smoke/
          if-no-files-found: ignore
          retention-days: 7
