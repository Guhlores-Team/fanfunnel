# Auto-apply database migrations so code and DB never drift.
#
# WHY: Vercel deploys the CODE from GitHub automatically, but nothing runs the
# SQL in supabase/migrations/. This workflow closes that gap:
#   - On a PR        -> apply migrations to the TEST Supabase project.
#   - On merge to main -> apply migrations to the PRODUCTION project.
# So a merged PR ships code AND its schema together — no manual psql, no terminal.
#
# IMPORTANT one-time setup before the first real migration PR (see docs):
#   1. Add the repo secrets listed below.
#   2. Reconcile migration history: mark 0001-0035 as already-applied in BOTH
#      the test and prod projects, so `db push` doesn't try to re-run them.
#
# Required GitHub repo secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_ACCESS_TOKEN       (Supabase dashboard -> Account -> Access Tokens)
#   SUPABASE_TEST_PROJECT_REF   (test project ref — the xxxx in xxxx.supabase.co)
#   SUPABASE_TEST_DB_PASSWORD   (test project database password)
#   SUPABASE_PROD_PROJECT_REF   (production project ref)
#   SUPABASE_PROD_DB_PASSWORD   (production project database password)
#
# Optional hardening: define GitHub "Environments" named `test` and `production`
# (Settings -> Environments) and add a required reviewer to `production` so prod
# migrations need a human click before they run.

name: Supabase migrations

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
  # Even a code-only Preview gets a no-op TEST check before CLI deployment.
  pull_request:

# Never run two migration pushes against the same target at once.
concurrency:
  group: supabase-migrate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    # PRs (and any non-main branch) target the TEST project.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: test
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          # Pinned (not `latest`) so CI is reproducible; bump it deliberately.
          version: 2.122.0
      - name: Apply migrations to TEST
        run: |
          # Refuse to write if the repository secret points at another project.
          test "${{ secrets.SUPABASE_TEST_PROJECT_REF }}" = "snmcrmhgevfqggxdiomu"
          supabase link --project-ref "${{ secrets.SUPABASE_TEST_PROJECT_REF }}" \
            --password "${{ secrets.SUPABASE_TEST_DB_PASSWORD }}"
          supabase db push --password "${{ secrets.SUPABASE_TEST_DB_PASSWORD }}"
      # One-time0059 TEST prerelease correction: retire this invocation with0060.
      # The helper only changes15 validated function search paths; no data/history.
      - name: Correct verified0059 TEST crypto search paths
        env:
          SUPABASE_TEST_PROJECT_REF: ${{ secrets.SUPABASE_TEST_PROJECT_REF }}
        run: node scripts/db/repair-test-crypto-0059.mjs
      - name: Confirm TEST migration history
        run: supabase migration list --linked --password "${{ secrets.SUPABASE_TEST_DB_PASSWORD }}"
      - name: Check src/lib/data/db.types.ts matches TEST
        # The committed row types must match the schema the migrations just
        # produced. The comparison ignores whitespace only: the file can come
        # from `npm run gen:types` (this CLI) or Supabase's hosted generator,
        # which emit the same types but may differ in blank lines/indentation.
        # Any change to a name, type or nullability still fails.
        shell: bash
        run: |
          generated="$RUNNER_TEMP/db.types.ts"
          supabase gen types typescript --project-id "${{ secrets.SUPABASE_TEST_PROJECT_REF }}" > "$generated"
          if ! cmp -s <(tr -d '[:space:]' < src/lib/data/db.types.ts) <(tr -d '[:space:]' < "$generated"); then
            echo "::error file=src/lib/data/db.types.ts::src/lib/data/db.types.ts is out of date with the database schema. Run \`npm run gen:types\` (with the CLI linked to a project at this migration) and commit the result."
            diff -u src/lib/data/db.types.ts "$generated" || true
            exit 1
          fi
          echo "src/lib/data/db.types.ts matches the TEST schema."

  production:
    # Only a real merge/push to main touches PRODUCTION.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          # Pinned (not `latest`) so CI is reproducible; bump it deliberately.
          version: 2.122.0
      - name: Apply migrations to PRODUCTION
        run: |
          supabase link --project-ref "${{ secrets.SUPABASE_PROD_PROJECT_REF }}" \
            --password "${{ secrets.SUPABASE_PROD_DB_PASSWORD }}"
          supabase db push --password "${{ secrets.SUPABASE_PROD_DB_PASSWORD }}"
