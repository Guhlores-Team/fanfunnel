name: CI

# Gate every push and PR on a clean typecheck/build, the unit + RLS-lint tests,
# and lint. This is the safety net DEPLOY.md's "merge to main" step relied on a
# human to run manually.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    # The in-app debug console is only compiled in when NEXT_PUBLIC_ENABLE_DEBUG=1
    # (N9 keeps it out of prod). The mock e2e drives it to assert zero console
    # errors across the creator flow, so enable it for this test build — otherwise
    # the launcher never mounts and "debug launcher present with ?debug=1" fails.
    env:
      NEXT_PUBLIC_ENABLE_DEBUG: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test (unit + RLS security lint)
        run: npm test

      - name: Build
        run: npm run build

      # ubuntu-latest is 26.04: needs playwright >= 1.61 (first release supporting it).
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E + a11y (mock mode)
        run: |
          npx next start -p 3000 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000 >/dev/null && break || sleep 2
          done
          E2E_BASE_URL=http://localhost:3000 npm run e2e
          STATUS=$?
          if [ $STATUS -eq 0 ]; then
            E2E_BASE_URL=http://localhost:3000 npm run e2e:a11y
            STATUS=$?
          fi
          kill $SERVER_PID 2>/dev/null || true
          exit $STATUS

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts
          path: e2e/artifacts/
          if-no-files-found: ignore

  # DEBT-7: the three hand-maintained SQL build artifacts must build the same DB.
  # Uses the PostgreSQL 16 binaries preinstalled on the runner image; the full
  # history is needed because the reference build starts from the original
  # schema.sql (see scripts/db/README.md).
  schema-drift:
    # Pinned for its preinstalled PostgreSQL 16 binaries (the drift check builds
    # throwaway clusters with initdb/pg_ctl), not for Playwright.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: schema.sql / migrations_combined.sql / migrations build the same DB
        run: node scripts/db/schema-drift-check.mjs
